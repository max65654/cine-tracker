name: Données Ciné Tracker (actus + tops)

on:
  schedule:
    - cron: '*/30 * * * *'   # toutes les 30 minutes (GitHub saute parfois des passages)
  workflow_dispatch:          # bouton « Run workflow » pour le lancer à la main

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Actus + tops
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node scripts/build-data.mjs
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "cine-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json tops.json tops-history.json
          if git diff --cached --quiet; then echo "Rien de neuf"; exit 0; fi
          git commit -m "🤖 actus et tops du $(date -u +'%d/%m %Hh%M') [skip ci]"
          git pull --rebase --autostash
          git push
